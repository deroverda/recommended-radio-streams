name: Lint

on:
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - ".github/workflows/**"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "README.md"
      - ".github/workflows/**"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Workflow and Script Lint (actionlint + shellcheck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: rhysd/actionlint@v1

  markdownlint:
    name: README Format Lint (markdownlint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: README.md
