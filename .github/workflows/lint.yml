name: Lint

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Workflow and Script Lint (actionlint + shellcheck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
