name: Lint

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - ".github/tests/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - ".github/tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Workflow and Script Lint (actionlint + shellcheck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Shellcheck probe-streams.sh
        shell: bash
        run: shellcheck .github/scripts/probe-streams.sh

      - name: Check Python scripts compile
        run: python3 -m py_compile .github/scripts/*.py

      - name: Parser fixture test
        shell: bash
        run: python3 .github/scripts/stream_parser.py --name-map .github/tests/parser_fixture.md | diff -u .github/tests/parser_expected.tsv -

      - name: Write lint summary (clean)
        if: success()
        run: echo "All lint checks passed (actionlint, shellcheck, Python compile, parser fixture test)." >> "$GITHUB_STEP_SUMMARY"

      - name: Write lint summary (failed)
        if: failure()
        run: echo "A lint check failed (actionlint, shellcheck, Python compile or parser fixture test), see the failed step's log above for details." >> "$GITHUB_STEP_SUMMARY"
