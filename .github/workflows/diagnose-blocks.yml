name: Diagnose Stream Blocks

# Temporary, manual-only test. Part 1 probes the three streams that are still
# refused from GitHub with five User-Agent labels. Part 2 prints their
# connection details. Part 3 fetches the websites that the link checker keeps
# flagging with four labels. Delete this file when done.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install ffmpeg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl ca-certificates

      - name: Diagnose blocks
        shell: bash
        run: |
          set -uo pipefail
          OUT="${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          STREAMS="$RUNNER_TEMP/streams.txt"
          SITES="$RUNNER_TEMP/sites.txt"
          RES="$RUNNER_TEMP/rows"
          mkdir -p "$RES"
          export RES

          # group|station|url
          cat > "$STREAMS" <<'EOF'
          refused|Totally Wired Radio|https://totallywired.out.airtime.pro/totallywired_a
          refused|Dansbandskanalen|https://fm09-ice.stream.khz.se/fm09_mp3
          refused|Liquid DooM Radio|http://83.240.65.106:8000/doom
          EOF

          # group|site|url
          cat > "$SITES" <<'EOF'
          cert error|giantsofjazzradio.co.uk|http://www.giantsofjazzradio.co.uk/
          cert error|compound-eye.org|https://compound-eye.org/
          cert error|mountainchill.com|https://mountainchill.com/
          reset|dinamo.fm|https://dinamo.fm/
          reset|dinamo.fm channels|https://dinamo.fm/content/4/channels
          reset|spacedogsradio.com|https://www.spacedogsradio.com/
          status|dansbandskanalen.se|https://www.dansbandskanalen.se/
          status|monoskop.org|https://monoskop.org/Community_radio
          timeout|liquiddoom.net|https://liquiddoom.net/
          timeout|le-grigri.com|https://www.le-grigri.com/
          EOF

          ua_for() {
            case "$1" in
              none) echo "" ;;
              mozilla) echo "Mozilla/5.0" ;;
              honest) echo "recommended-radio-streams-probe/1.0 (+https://github.com/deroverda/recommended-radio-streams)" ;;
              chrome) echo "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36" ;;
              vlc) echo "VLC/3.0.21 LibVLC/3.0.21" ;;
            esac
          }

          # One ffmpeg decode of 5 seconds. Prints OK with mean volume, or a short error code.
          try_ffmpeg() {
            local url="$1" ua="$2" out rc vol code
            local -a ua_args=()
            [ -n "$ua" ] && ua_args=(-user_agent "$ua")
            out=$(timeout 25 ffmpeg -hide_banner -nostdin -v info "${ua_args[@]}" \
              -i "$url" -map 0:a:0 -vn -sn -dn -t 5 -af volumedetect -f null - 2>&1)
            rc=$?
            out="${out//"$url"/}"
            if [ "$rc" -eq 0 ]; then
              vol=$(printf '%s' "$out" | sed -nE 's/.*mean_volume: (-?[0-9.]+) dB.*/\1/p' | tail -n 1)
              echo "OK ${vol:-?}dB"
              return
            fi
            code=$(printf '%s' "$out" | grep -oE '(HTTP error |returned )[45][0-9X]{2}' | head -n 1 | grep -oE '[45][0-9X]{2}')
            if [ -n "$code" ]; then
              echo "$code"
            elif [ "$rc" -eq 124 ] || printf '%s' "$out" | grep -qi 'timed out'; then
              echo "TIMEOUT"
            elif printf '%s' "$out" | grep -qi 'Connection refused'; then
              echo "REFUSED"
            elif printf '%s' "$out" | grep -qiE 'Name or service not known|Could not resolve|No address associated'; then
              echo "DNS"
            elif printf '%s' "$out" | grep -qiE 'SSL|TLS|certificate|handshake'; then
              echo "TLS"
            else
              echo "ERR"
            fi
          }

          # One website fetch, following redirects. Prints the HTTP status, plus the curl exit code when curl failed.
          try_site() {
            local url="$1" ua="$2" code rc
            local -a ua_args=()
            [ -n "$ua" ] && ua_args=(-A "$ua")
            code=$(curl -s -o /dev/null -L -w '%{http_code}' --max-time 20 "${ua_args[@]}" "$url" 2>/dev/null)
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "$code"
            else
              echo "${code:-000} (exit $rc)"
            fi
          }

          # $1 is one list line: idx|group|station|url
          probe_row() {
            local idx group name url label row
            IFS="|" read -r idx group name url <<< "$1"
            row="| $group | $name |"
            for label in none mozilla honest chrome vlc; do
              row="$row $(try_ffmpeg "$url" "$(ua_for "$label")") |"
            done
            printf '%s\n' "$row" > "$RES/$idx.row"
          }

          probe_site_row() {
            local idx group name url label row
            IFS="|" read -r idx group name url <<< "$1"
            row="| $group | $name |"
            for label in none mozilla honest chrome; do
              row="$row $(try_site "$url" "$(ua_for "$label")") |"
            done
            printf '%s\n' "$row" > "$RES/s$idx.row"
          }

          export -f ua_for try_ffmpeg try_site probe_row probe_site_row

          {
            echo "# Block diagnosis, round 2"
            echo
            echo "Started: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "## Part 1: the three streams still refused (5 second ffmpeg decode per cell)"
            echo
            echo "OK shows the mean volume. Numbers are HTTP status codes."
            echo
            echo "| Group | Station | none (ffmpeg default) | Mozilla/5.0 | honest | Chrome | VLC |"
            echo "|---|---|---|---|---|---|---|"
          } >> "$OUT"

          awk '{printf "%03d|%s\n", NR, $0}' "$STREAMS" \
            | xargs -d '\n' -P 3 -n 1 bash -c "probe_row \"\$1\"" _

          cat "$RES"/[0-9]*.row >> "$OUT"

          {
            echo
            echo "## Part 2: connection details for the three streams (honest user agent)"
            echo
            echo "Lines starting with an asterisk show the connection steps. Lines starting with a less-than sign are the server's response headers."
          } >> "$OUT"

          while IFS="|" read -r _ name url; do
            {
              echo
              echo "### $name"
              echo
              echo '```'
              curl -sv --connect-timeout 12 --max-time 15 -o /dev/null -A "$(ua_for honest)" "$url" 2>&1 \
                | tr -d '\r' \
                | grep -E '^< |Connected to|Failed to connect|Timeout|timed out|Immediate connect|SSL certificate|expire date|issuer' \
                | head -n 40 || true
              echo '```'
            } >> "$OUT"
          done < "$STREAMS"

          {
            echo
            echo "## Part 3: websites the link checker keeps flagging (curl, 4 at a time)"
            echo
            echo "Numbers are the final HTTP status after redirects. A cell with exit N means curl failed: 6 DNS, 7 refused, 28 timeout, 35 TLS handshake, 56 connection reset, 60 certificate problem."
            echo
            echo "| Group | Site | curl default | Mozilla/5.0 | honest | Chrome |"
            echo "|---|---|---|---|---|---|"
          } >> "$OUT"

          awk '{printf "%03d|%s\n", NR, $0}' "$SITES" \
            | xargs -d '\n' -P 4 -n 1 bash -c "probe_site_row \"\$1\"" _

          cat "$RES"/s*.row >> "$OUT"
