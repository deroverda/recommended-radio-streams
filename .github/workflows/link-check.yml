name: Link & Stream Health Checks

on:
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - ".github/workflows/link-check.yml"
      - ".github/scripts/probe-streams.sh"
      - ".github/scripts/stream_parser.py"
  pull_request:
    paths:
      - "README.md"
      - ".github/workflows/link-check.yml"
      - ".github/scripts/probe-streams.sh"
      - ".github/scripts/stream_parser.py"
  schedule:
    - cron: "0 0 * * 1" # weekly on Monday at UTC midnight
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: Link Checker (websites only)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the updated lychee-state.json back - the
                         # workflow-level default above is read-only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Exclude stream URLs from Lychee
        shell: bash
        run: |
          set -euo pipefail
          # Uses the same parser as probe-streams.sh (.github/scripts/stream_parser.py)
          # so this list can never drift from what the stream probe considers a
          # stream link.
          python3 .github/scripts/stream_parser.py --name-map README.md | cut -f1 > /tmp/stream_urls.txt
          sed -E 's/[][\\.^$?*+(){}|]/\\&/g' /tmp/stream_urls.txt | sort -u > .lycheeignore
          echo "Excluded $(wc -l < .lycheeignore) stream URLs from Lychee."

      - name: Run Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          failIfEmpty: true
          format: markdown
          output: lychee/lychee-report.md
          jobSummary: false   # written manually below, once the report carries the
                               # caveat and consecutive-failure notes
          args: |
            --no-progress
            --max-concurrency 6
            --host-concurrency 2
            --host-request-interval 1s
            --timeout 30
            --retry-wait-time 15
            --user-agent "Mozilla/5.0"
            --header "Accept: */*"
            --accept "100..=103,200..=299"
            --exclude "localhost"
            --exclude "127.0.0.1"
            --exclude "github.com/deroverda/recommended-radio-streams/stargazers"
            README.md
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Add reliability caveat to Lychee report
        if: always()
        shell: bash
        run: |
          CAVEAT="> Note: this report reflects a single run from GitHub's datacenter IP.
          > Many hosts block or rate-limit that IP range, which can show up as SSL,
          > connection-reset, or HTTP-level errors even when a site is fine.
          > Treat single-run errors as inconclusive - only investigate a URL if it
          > appears as an error across multiple consecutive weekly runs."

          if [ -f lychee/lychee-report.md ]; then
            { echo "$CAVEAT"; echo ""; cat lychee/lychee-report.md; } > lychee/lychee-report.tmp.md
            mv lychee/lychee-report.tmp.md lychee/lychee-report.md
          fi
          # Job summary is written once, further down, after the report also
          # carries consecutive-failure notes - no separate append here.

      - name: Track consecutive Lychee failures
        if: always()
        shell: bash
        run: |
          [ -f lychee/lychee-report.md ] || exit 0
          # Reads the report just produced, tracks how many consecutive runs each
          # failing URL has appeared for (persisted in .github/lychee-state.json,
          # committed further down), and appends a "[N consecutive runs]" note to
          # any URL that's failed more than once in a row - mirrors probe-streams.sh's
          # consecutive-failure tracking, so a false positive that's been noisy for
          # months reads differently from a fresh, first-time failure. Only failing
          # URLs are ever written to the state file - a URL that stops failing simply
          # drops out next run.
          python3 - lychee/lychee-report.md .github/lychee-state.json <<'PYEOF'
          import json
          import re
          import sys

          # Matches a lychee markdown report error/timeout bullet, e.g.:
          # * [404] <https://fade.radio/> (at 214:3) | Rejected status code: 404 Not Found
          ENTRY_RE = re.compile(r'^\* \[(?P<code>[^\]]+)\] <(?P<url>[^>]+)> \(at [^)]+\) \| (?P<detail>.*)$')

          report_path, state_path = sys.argv[1], sys.argv[2]
          # Codes a datacenter-IP block typically produces. No longer accepted
          # as success by lychee's --accept list above, so they now reach
          # this tracker - labelled here so they read differently from a
          # code CI can actually trust (404, DNS failure, expired cert).
          BLOCKED_CODES = {"401", "403", "406", "415", "429"}

          with open(report_path, encoding='utf-8') as f:
              lines = f.readlines()

          urls_this_run = [m.group('url') for line in lines if (m := ENTRY_RE.match(line.strip()))]

          try:
              with open(state_path, encoding='utf-8') as f:
                  prev = json.load(f)
          except Exception:
              prev = {}

          new_state = {
              url: {"consecutive_failures": prev.get(url, {}).get("consecutive_failures", 0) + 1}
              for url in urls_this_run
          }

          with open(state_path, 'w', encoding='utf-8') as f:
              json.dump(new_state, f, indent=2, sort_keys=True)
              f.write('\n')

          out_lines = []
          for line in lines:
              m = ENTRY_RE.match(line.strip())
              if m:
                  count = new_state[m.group('url')]['consecutive_failures']
                  note = " _(likely CI IP block)_" if m.group('code') in BLOCKED_CODES else ""
                  if count > 1:
                      note = f" **[{count} consecutive runs]**{note}"
                  if note:
                      line = line.rstrip('\n') + note + "\n"
              out_lines.append(line)

          with open(report_path, 'w', encoding='utf-8') as f:
              f.writelines(out_lines)
          PYEOF

      - name: Write Lychee job summary
        if: always()
        shell: bash
        run: |
          if [ -f lychee/lychee-report.md ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat lychee/lychee-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Lychee report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lychee-report
          path: lychee/lychee-report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Commit updated lychee state
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f .github/lychee-state.json ] || exit 0
          git add .github/lychee-state.json
          git diff --cached --quiet && exit 0
          git commit -m "Update lychee state (consecutive-failure tracking)"
          # generate-playlists.yml and the stream-probe job below can also push
          # to main during this run. The state file is regenerated every run, so
          # on a race keep our version rebased onto latest main (-X theirs),
          # retry a few times, and never fail the job over the bookkeeping
          # commit - the report itself is already uploaded above.
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5..."
            git fetch origin main || continue
            git rebase -X theirs origin/main || { git rebase --abort 2>/dev/null || true; continue; }
            git push && exit 0
          done
          msg="lychee state commit kept losing the push race after ${attempt} attempts; skipping (non-fatal)"
          echo "$msg"
          [ -n "${GITHUB_STEP_SUMMARY:-}" ] && echo "> $msg" >> "$GITHUB_STEP_SUMMARY"
          exit 0

  stream-probe:
    name: Stream Audio Probe
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the updated probe-state.json back - the
                         # workflow-level default above is read-only for the lychee job

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install ffmpeg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl ca-certificates

      - name: Probe streams
        id: probe
        shell: bash
        env:
          JOBS: 8
          DECODE_SECONDS: 8
          PROBE_TIMEOUT: 30
          MAX_RETRIES: 2
          RETRY_BASE_DELAY: 2
        run: |
          rc=0
          bash .github/scripts/probe-streams.sh || rc=$?
          # Exit 3 = the README parser produced zero stream URLs (state left
          # untouched, a short report was written). Surface that as a job
          # failure. Any other non-zero is a partial probe failure and stays
          # non-fatal, which is what the old "|| true" protected.
          [ "$rc" -eq 3 ] && exit 1
          exit 0

      - name: Commit updated probe state
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The probe step above captures its exit code (rc=$?) rather than using a bare
          # `|| true`, and only hard-fails on rc=3 (zero URLs parsed) - any other non-zero
          # exit is non-fatal, which means the state file may not exist yet. Nothing to
          # commit in that case.
          [ -f .github/probe-state.json ] || exit 0
          git add .github/probe-state.json
          git diff --cached --quiet && exit 0
          git commit -m "Update probe state (consecutive-failure tracking)"
          # generate-playlists.yml and the lychee job above also push to main
          # during this run. The state file is regenerated every run, so on a
          # race keep our version rebased onto latest main (-X theirs), retry a
          # few times, and never fail the job over the bookkeeping commit - the
          # report itself is uploaded in the next step.
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5..."
            git fetch origin main || continue
            git rebase -X theirs origin/main || { git rebase --abort 2>/dev/null || true; continue; }
            git push && exit 0
          done
          msg="probe state commit kept losing the push race after ${attempt} attempts; skipping (non-fatal)"
          echo "$msg"
          [ -n "${GITHUB_STEP_SUMMARY:-}" ] && echo "> $msg" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload stream report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stream-probe-report
          path: stream-report.md
          if-no-files-found: error
          retention-days: 14
