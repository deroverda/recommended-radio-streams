name: Link & Stream Health Checks

on:
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - ".github/workflows/link-check.yml"
      - ".github/scripts/probe-streams.sh"
  pull_request:
    paths:
      - "README.md"
      - ".github/workflows/link-check.yml"
      - ".github/scripts/probe-streams.sh"
  schedule:
    - cron: "0 0 * * 1" # weekly on Monday at UTC midnight
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: Link Checker (websites only)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the updated lychee-state.json back - the
                         # workflow-level default above is read-only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Exclude stream URLs from Lychee
        shell: bash
        run: |
          set -euo pipefail
          # Same URL-extraction logic as build_name_map() in probe-streams.sh
          # (trailing "/"-joined chain of any-labeled links at end of line,
          # narrow Stream/Channel-N/N form as fallback) - the old grep here
          # only recognized that narrow form and silently let custom-labeled
          # multi-stream entries (Echoes of Bluemars, Sleepscapes, Subsonic
          # Radio) through to Lychee as if they were ordinary web pages.
          python3 - README.md > /tmp/stream_urls.txt <<'PYEOF'
          import re
          import sys

          ENTRY_RE = re.compile(
              r'^-\s*(?:⭐\s*)?\[(?P<name>[^\]]+)\]\((?P<homepage>[^)]+)\):\s*'
              r'(?P<desc>.*)$'
          )
          STREAM_RE = re.compile(r'\[(Stream|Channel\s*[12]|[12])\]\((?P<url>[^)]+)\)', re.I)
          STREAM_CHAIN_RE = re.compile(
              r'(?:\[[^\]]+\]\([^)]+\)\s*/\s*)*\[[^\]]+\]\([^)]+\)\s*$'
          )
          STREAM_LINK_RE = re.compile(r'\[[^\]]+\]\((?P<url>[^)]+)\)')

          def entry_stream_urls(line):
              m = STREAM_CHAIN_RE.search(line)
              if m:
                  urls = STREAM_LINK_RE.findall(m.group(0))
                  if urls:
                      return urls
              return [u for _label, u in STREAM_RE.findall(line)]

          with open(sys.argv[1], encoding='utf-8') as f:
              for raw in f:
                  s = raw.strip()
                  if ENTRY_RE.match(s):
                      for url in entry_stream_urls(s):
                          print(url)
          PYEOF
          sed -E 's/[][\\\.^$?*+(){}|]/\\&/g' /tmp/stream_urls.txt | sort -u > .lycheeignore
          echo "Excluded $(wc -l < .lycheeignore) stream URLs from Lychee."

      - name: Run Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          failIfEmpty: true
          format: markdown
          output: lychee/lychee-report.md
          jobSummary: false   # written manually below, once the report carries the
                               # caveat and consecutive-failure notes
          args: |
            --no-progress
            --max-concurrency 6
            --host-concurrency 2
            --host-request-interval 1s
            --timeout 30
            --retry-wait-time 15
            --user-agent "Mozilla/5.0"
            --header "Accept: */*"
            --accept "100..=103,200..=299,401,403,406,415,429"
            --exclude "localhost"
            --exclude "127.0.0.1"
            README.md
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Add reliability caveat to Lychee report
        if: always()
        shell: bash
        run: |
          CAVEAT="> Note: this report reflects a single run from GitHub's datacenter IP.
          > Many hosts block or rate-limit that IP range, which can show up as SSL,
          > connection-reset, or HTTP-level errors even when a site is fine.
          > Treat single-run errors as inconclusive - only investigate a URL if it
          > appears as an error across multiple consecutive weekly runs."

          if [ -f lychee/lychee-report.md ]; then
            { echo "$CAVEAT"; echo ""; cat lychee/lychee-report.md; } > lychee/lychee-report.tmp.md
            mv lychee/lychee-report.tmp.md lychee/lychee-report.md
          fi
          # Job summary is written once, further down, after the report also
          # carries consecutive-failure notes - no separate append here.

      - name: Track consecutive Lychee failures
        if: always()
        shell: bash
        run: |
          [ -f lychee/lychee-report.md ] || exit 0
          # Reads the report just produced, tracks how many consecutive runs each
          # failing URL has appeared for (persisted in .github/lychee-state.json,
          # committed further down), and appends a "[N consecutive runs]" note to
          # any URL that's failed more than once in a row - mirrors probe-streams.sh's
          # consecutive-failure tracking, so a false positive that's been noisy for
          # months reads differently from a fresh, first-time failure. Only failing
          # URLs are ever written to the state file - a URL that stops failing simply
          # drops out next run.
          python3 - lychee/lychee-report.md .github/lychee-state.json <<'PYEOF'
          import json
          import re
          import sys

          # Matches a lychee markdown report error/timeout bullet, e.g.:
          # * [404] <https://fade.radio/> (at 214:3) | Rejected status code: 404 Not Found
          ENTRY_RE = re.compile(r'^\* \[(?P<code>[^\]]+)\] <(?P<url>[^>]+)> \(at [^)]+\) \| (?P<detail>.*)$')

          report_path, state_path = sys.argv[1], sys.argv[2]

          with open(report_path, encoding='utf-8') as f:
              lines = f.readlines()

          urls_this_run = [m.group('url') for line in lines if (m := ENTRY_RE.match(line.strip()))]

          try:
              with open(state_path, encoding='utf-8') as f:
                  prev = json.load(f)
          except Exception:
              prev = {}

          new_state = {
              url: {"consecutive_failures": prev.get(url, {}).get("consecutive_failures", 0) + 1}
              for url in urls_this_run
          }

          with open(state_path, 'w', encoding='utf-8') as f:
              json.dump(new_state, f, indent=2, sort_keys=True)
              f.write('\n')

          out_lines = []
          for line in lines:
              m = ENTRY_RE.match(line.strip())
              if m:
                  count = new_state[m.group('url')]['consecutive_failures']
                  if count > 1:
                      line = line.rstrip('\n') + f" **[{count} consecutive runs]**\n"
              out_lines.append(line)

          with open(report_path, 'w', encoding='utf-8') as f:
              f.writelines(out_lines)
          PYEOF

      - name: Write Lychee job summary
        if: always()
        shell: bash
        run: |
          if [ -f lychee/lychee-report.md ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat lychee/lychee-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Lychee report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lychee-report
          path: lychee/lychee-report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Commit updated lychee state
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f .github/lychee-state.json ] || exit 0
          git add .github/lychee-state.json
          git diff --cached --quiet && exit 0
          git commit -m "Update lychee state (consecutive-failure tracking)"
          # generate-playlists.yml and the stream-probe job below can also push
          # to main - rebase onto whatever landed first instead of failing the
          # job over an unrelated push.
          git pull --rebase --autostash
          git push

  stream-probe:
    name: Stream Audio Probe
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the updated probe-state.json back - the
                         # workflow-level default above is read-only for the lychee job

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install ffmpeg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl ca-certificates

      - name: Probe streams
        id: probe
        shell: bash
        env:
          JOBS: 8
          DECODE_SECONDS: 8
          PROBE_TIMEOUT: 30
          MAX_RETRIES: 2
          RETRY_BASE_DELAY: 2
        run: bash .github/scripts/probe-streams.sh || true

      - name: Commit updated probe state
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The probe step above is allowed to fail (`|| true`) so one bad run
          # never fails the whole job - which means the state file may not
          # exist yet. Nothing to commit in that case.
          [ -f .github/probe-state.json ] || exit 0
          git add .github/probe-state.json
          git diff --cached --quiet && exit 0
          git commit -m "Update probe state (consecutive-failure tracking)"
          # generate-playlists.yml also pushes to main on a README change, so
          # this push can lose a race to it - rebase onto whatever landed
          # first instead of failing the job over an unrelated push.
          git pull --rebase --autostash
          git push

      - name: Upload stream report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stream-probe-report
          path: stream-report.md
          if-no-files-found: error
          retention-days: 14
